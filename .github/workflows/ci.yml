name: CI

on:
  push:
    branches: [master, production]
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder' }}

  schema-drift:
    needs: test-and-build
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - name: Skip when Supabase secrets are not configured
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
        if: env.NEXT_PUBLIC_SUPABASE_URL == ''
        run: exit 0
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check production schema matches the app
        run: node --experimental-strip-types scripts/check-schema.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  prod-smoke:
    needs: test-and-build
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    steps:
      - name: Skip when health URL is not configured
        env:
          PROD_HEALTH_URL: ${{ secrets.PROD_HEALTH_URL }}
        if: env.PROD_HEALTH_URL == ''
        run: exit 0
      - name: Diagnostic - dump what the runner receives
        run: |
          echo "=== health URL probe ==="
          curl -sS -D - --max-time 30 "$PROD_HEALTH_URL$HEALTH_QUERY" -o /tmp/diag1.txt 2>/dev/null || echo "(curl exit $?)"
          echo "--- body (first 600 bytes) ---"
          head -c 600 /tmp/diag1.txt; echo
          echo "=== deployment alias probe ==="
          curl -sS -D - --max-time 30 "https://sajilokhata-lngiris-projects.vercel.app/api/health$HEALTH_QUERY" -o /tmp/diag2.txt 2>/dev/null || echo "(curl exit $?)"
          echo "--- body (first 600 bytes) ---"
          head -c 600 /tmp/diag2.txt; echo
        env:
          PROD_HEALTH_URL: ${{ secrets.PROD_HEALTH_URL }}
          HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
          HEALTH_QUERY: ${{ secrets.HEALTH_TOKEN != '' && format('?token={0}', secrets.HEALTH_TOKEN) || '' }}
      - name: Wait for deploy, then probe /api/health
        run: |
          ok=0
          for i in $(seq 1 24); do
            sleep 20
            if curl -fsS "$PROD_HEALTH_URL$HEALTH_QUERY" -o /tmp/health.json 2>/dev/null; then
              if node -e "const j = require('/tmp/health.json'); if (!j || typeof j !== 'object' || j.ok !== true) process.exit(1)"; then
                echo "PRODUCTION HEALTHY"
                ok=1
                break
              fi
            fi
          done
          if [ "$ok" != "1" ]; then echo "Health endpoint never became healthy"; exit 1; fi
        env:
          PROD_HEALTH_URL: ${{ secrets.PROD_HEALTH_URL }}
          HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
          HEALTH_QUERY: ${{ secrets.HEALTH_TOKEN != '' && format('?token={0}', secrets.HEALTH_TOKEN) || '' }}
